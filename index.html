            }
            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid #3f3f46;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
            .staticrypt-page {
                box-sizing: border-box;
                width: min(100%, 28rem);
                margin: 0 auto;
                padding: 12vh 1.25rem 3rem;
            }
            .staticrypt-form {
                text-align: left;
            }
            .staticrypt-title {
                margin: 0;
                font-size: clamp(2.4rem, 8vw, 3.4rem);
                font-weight: 600;
                letter-spacing: -0.04em;
                line-height: 1.05;
            }
            .staticrypt-instructions p {
                margin: 0.85rem 0 0;
                color: #e4e4e7;
                font-size: 1.15rem;
            }
            .staticrypt-password-container {
                position: relative;
                margin-top: 1.75rem;
            }
            #staticrypt-password {
                box-sizing: border-box;
                width: 11.5rem;
                max-width: 100%;
                padding: 0.55rem 2.2rem 0.55rem 0.7rem;
                border: 1px solid #3f3f46;
                border-radius: 0.55rem;
                background: #121214;
                color: #f4f4f5;
                font: inherit;
                font-size: 0.95rem;
            }
            .staticrypt-toggle-password-visibility {
                position: absolute;
                top: 0.55rem;
                left: 9.1rem;
                width: 1.15rem;
                height: 1.15rem;
                cursor: pointer;
                filter: invert(1);
            }
            .staticrypt-remember {
                display: block;
                margin-top: 0.8rem;
                color: #c8c8d0;
                font-size: 0.92rem;
            }
            .staticrypt-decrypt-button {
                display: inline-block;
                margin-top: 0.9rem;
                padding: 0.45rem 0.95rem;
                border: 0;
                border-radius: 999px;
                background: #2563eb;
                color: #ffffff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
            .staticrypt-linkedin {
                display: inline-block;
                margin-top: 1.5rem;
                color: #93c5fd;
                font-weight: 600;
            }
            .staticrypt-token-stash {
                display: none;
            }
